# The orbit-history archive, served from bigmem-PC over WireGuard only.
#
# WHY THIS EXISTS (Sean, 2026-08-27): "the orbit histories should reside on
# bigmem-pc. It has the space. I don't want the VPS storing huge files...
# Bigmem-pc should be the repository that the VPS reaches out to."
#
# One release of the archive is 256 shards / 4.1 GB and orbit-release rewrites
# every one of them hourly. The VPS has ~15 GB free on a 91%-full disk that
# also runs Bob, the gateway and every other service on the estate, so up to
# four resident generations of this archive is an estate-wide outage risk. The
# shards therefore never leave this machine; the VPS reverse-proxies the single
# shard a reader actually asks for.
#
# WHAT IS EXPOSED, AND WHERE
#   This server listens on 8080 INSIDE the container. Compose publishes it on
#   ${ORBIT_ARCHIVE_BIND}:8096 -- one private address, and ONLY that address.
#   It is not on 0.0.0.0, not on the machine's LAN address, and not on the
#   home router. This is a personal machine on a home connection; a listener
#   here that answered the public internet would be a serious mistake.
#
# WHAT IS SERVABLE
#   Exactly the orbit-history shards, named in full by a regex with no dot and
#   no slash inside the capture. The mount is the whole published artifact
#   directory (~30 GB: aurora frames, SWMF cuts, the catalog, the manifest),
#   and NONE of it has a URL on this server. There is no directory listing, no
#   try_files fallback, no SPA rewrite, and the catch-all is a bare 404. A path
#   traversal here reaches a personal machine, so the rule is an allow-list of
#   one shape rather than a deny-list of bad ones.
#
# WHY gzip_static
#   A shard is ~20 MB of JSON and ~2.2 MB gzipped, and it crosses a residential
#   UPLINK. `orbit_release.py` already writes the .gz beside every shard, so
#   this serves the pre-compressed file and the home connection carries a ninth
#   of the bytes. It is never generated on the fly: no .gz, no compression.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    autoindex off;

    # The public path is kept verbatim end to end -- the browser asks for
    # /space/data/artifacts/orbit-history-NNN-HASH.json, Caddy proxies that
    # path unrewritten, and this location matches the same string. Nothing on
    # either host rewrites the URL, so there is no rewrite rule to get wrong.
    location ~ "^/space/data/artifacts/(orbit-history-[0-9]{1,4}-[0-9a-f]{6,64}\.json)$" {
        alias /srv/orbit-history/$1;
        gzip_static on;
        gzip_vary on;
        # gzip_proxied any -- NOT optional, and it cost a measurement to find.
        # nginx calls a request "proxied" when it carries a Via header, and
        # `gzip_proxied` (default: off) governs gzip_static as well as gzip.
        # Left at the default, this server hands the pre-built .gz to a direct
        # curl and the raw 20.5 MB to anything arriving through Caddy -- which
        # is every real reader. Measured 2026-08-27: direct 2,189,116 B, via
        # Caddy 20,512,075 B, same URL, same second. Everything reaching this
        # server is a proxied request by design, so `any` is the honest value.
        gzip_proxied any;
        default_type application/json;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        # Names the machine that actually answered, so an operator reading a
        # response header can tell a bigmem hit from anything the VPS still
        # holds. Costs nothing and settles that question without a traceroute.
        add_header X-Orbit-Archive "bigmem-pc" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else. Not a redirect, not an index, not the mounted tree.
    location / {
        access_log off;
        return 404;
    }
}
