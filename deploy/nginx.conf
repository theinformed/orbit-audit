server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /data/manifest.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /data/artifacts/ {
        try_files $uri =404;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # -----------------------------------------------------------------------
    # THE CADENCE CONTROL. See ops/cadence.py for the whole design.
    #
    # This is the only writable thing in this deployment, and what it writes is
    # an EMPTY-ISH FILE WHOSE NAME IS THE WHOLE MESSAGE. bigmem pulls the
    # directory on its publish cycle, reads which of a fixed set of filenames
    # exists, validates it AGAIN against its own allow-list, and edits its own
    # systemd timer. Nothing here executes anything, and nothing on this
    # machine ever runs anything on bigmem's behalf.
    #
    # The allow-list is these `location =` blocks. There is one per cadence and
    # there is no pattern, no capture group and no variable anywhere in the
    # mapped path, so there is no URL a caller can construct that writes
    # anywhere else -- not with `..`, not with an encoded slash, not with a
    # null byte. tests/test_cadence.py asserts this list matches
    # ops/cadence.CADENCES exactly, so the two cannot drift apart.
    #
    # Caddy already routes /space/ops/* here behind forward_auth and rewrites
    # it to /ops/*, so these need no Caddyfile change and are never reachable
    # from the public /space/* handler.
    #
    # The body is ignored by everything downstream; ops/cadence.py never opens
    # these files. It is capped at 1 kB anyway, and `limit_except PUT` means it
    # cannot be read back out over HTTP either -- a GET of one of these paths
    # is 403, so this is a write-only drop box, not a place to park content.
    #
    # Verified against nginx 1.30.4-alpine on 2026-08-08, the same image the
    # VPS runs: the six names below return 201; `every-3h`, `off`, an empty
    # name and `hourly%20` return 404; `../../etc/passwd` and `%2e%2e%2fpasswd`
    # return 405; a null byte returns 400; GET/POST/DELETE/MKCOL/COPY/MOVE all
    # return 403; a 5 kB body returns 413; and a PUT anywhere else in the tree
    # writes nothing.
    # -----------------------------------------------------------------------
    location /ops/cadence/ {
        # Anything not named below. A cadence this deployment does not know is
        # a 404, never a file.
        return 404;
    }

    location = /ops/cadence/hourly {
        limit_except PUT { deny all; }
        alias /var/lib/space-ops/hourly;
        dav_methods PUT;
        dav_access user:rw group:rw all:r;
        client_max_body_size 1k;
    }

    location = /ops/cadence/every-2h {
        limit_except PUT { deny all; }
        alias /var/lib/space-ops/every-2h;
        dav_methods PUT;
        dav_access user:rw group:rw all:r;
        client_max_body_size 1k;
    }

    location = /ops/cadence/every-4h {
        limit_except PUT { deny all; }
        alias /var/lib/space-ops/every-4h;
        dav_methods PUT;
        dav_access user:rw group:rw all:r;
        client_max_body_size 1k;
    }

    location = /ops/cadence/every-6h {
        limit_except PUT { deny all; }
        alias /var/lib/space-ops/every-6h;
        dav_methods PUT;
        dav_access user:rw group:rw all:r;
        client_max_body_size 1k;
    }

    location = /ops/cadence/every-12h {
        limit_except PUT { deny all; }
        alias /var/lib/space-ops/every-12h;
        dav_methods PUT;
        dav_access user:rw group:rw all:r;
        client_max_body_size 1k;
    }

    location = /ops/cadence/daily {
        limit_except PUT { deny all; }
        alias /var/lib/space-ops/daily;
        dav_methods PUT;
        dav_access user:rw group:rw all:r;
        client_max_body_size 1k;
    }

    location = /ops/cadence/weekly {
        limit_except PUT { deny all; }
        alias /var/lib/space-ops/weekly;
        dav_methods PUT;
        dav_access user:rw group:rw all:r;
        client_max_body_size 1k;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }
}
