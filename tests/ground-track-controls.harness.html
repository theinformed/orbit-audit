<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ground-track window control harness</title>
    <style>
      html, body { margin: 0; background: #050d14; color: #edf8fb; font-family: system-ui, sans-serif; }
      #mount { width: 1000px; padding: 18px; }
      :root { --line: rgba(132,194,214,.18); --cyan: #29d4e3; --cyan-bright: #5ce8f1; --muted: #8da8b3; --text: #edf8fb; --amber: #f5c96a; }
    </style>
  </head>
  <body>
    <!--
      Mounts the real ground-track map, with a real SGP4 propagator behind it,
      so the window controls and the footprint can be driven the way a visitor
      drives them. Loaded through Vite by tests/ground-track-controls.spec.ts;
      dev-only, so it never reaches the production build.
    -->
    <div id="mount"></div>
    <script type="module" src="./ground-track-controls.harness.ts"></script>
  </body>
</html>
